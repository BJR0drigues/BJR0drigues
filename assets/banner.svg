<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Brayan J. Rodrigues - Dev, Automacao e IA Aplicada, Freelance">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b0000"/>
      <stop offset="0.5" stop-color="#b71c1c"/>
      <stop offset="1" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#fade)"/>

  <g stroke="#e53935" stroke-opacity="0.05">
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="110" x2="1000" y2="110"/>
    <line x1="0" y1="165" x2="1000" y2="165"/>
  </g>

  <path d="M0,175 C160,140 320,205 500,178 C680,151 840,205 1000,172 L1000,220 L0,220 Z" fill="url(#wave)" opacity="0.28"/>
  <path d="M0,190 C180,160 360,215 540,190 C720,165 860,210 1000,188 L1000,220 L0,220 Z" fill="url(#wave)" opacity="0.55"/>
  <path d="M0,205 C200,182 380,222 560,204 C740,186 880,218 1000,202 L1000,220 L0,220 Z" fill="url(#wave)"/>

  <text x="500" y="66" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" letter-spacing="4" fill="#e53935">// AUTOMAÇÃO · INTEGRAÇÕES · IA APLICADA</text>

  <text x="500" y="120" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="46" letter-spacing="1" fill="#ffffff"><tspan fill="#e53935">Brayan</tspan> J. Rodrigues<tspan fill="#e53935" dx="6">_<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <text x="500" y="150" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="15" fill="#9a9aa0">Dev · Freelance · de Planaltina-GO pra onde precisar</text>
</svg>
